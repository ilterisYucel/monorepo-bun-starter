# SonarCloud Monorepo Configuration
sonar.organization=ilterisyucel
sonar.projectKey=gd-pms-monorepo
sonar.projectName=GD PMS Monorepo

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.exclusions=\
  **/dist/**,\
  **/node_modules/**,\
  **/out/**,\
  **/release/**,\
  **/.nx/**,\
  **/storybook-static/**,\
  **/__stories__/**

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.base.json

# Quality gate: fail CI if gate fails
sonar.qualitygate.wait=true

# Pull request decoration
sonar.pullrequest.github.repository=ilterisYucel/monorepo-bun-starter
sonar.pullrequest.provider=github

# Coverage reports
# Coverage and test execution reports are disabled until unit tests are written.
# sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
# sonar.testExecutionReportPaths=**/test-results/junit.xml

sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,e2e/**
