# Dev tünel static upstream'i — build edilmiş container SPA (dist) servis eder.
# Neden dev Vite değil: Vite dev sunucusu modül URL'lerini mutlak üretir
# (/@vite/client, /src/main.tsx) — tünel subpath'inde (/containers/:cid/ui/)
# SPA boot edemez (T4.1). Build edilmiş SPA (base:"./") her subpath'te çalışır.
# Ön koşul: nx run container-web:build (dist üretilmiş olmalı).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
