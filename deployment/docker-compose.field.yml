name: field-stack

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: field-timescaledb
    command:
      - -cshared_buffers=256MB
      - -cwork_mem=4MB
      - -ceffective_cache_size=768MB
      - -cmaintenance_work_mem=64MB
      - -cmax_connections=50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: battery
    ports:
      - "5434:5432"
    volumes:
      - field-timescale-data:/var/lib/postgresql/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battery"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: field-redis
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6381:6379"
    volumes:
      - field-redis-data:/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Field tier device-service — Wattox PCS'ler (konteyner başına 1; PCS-1..PCS-N).
  # PCS-WATTOX-MIMARISI.md: PCS'ler field katmanında okunur/kontrol edilir.
  device-service:
    build:
      context: ../
      dockerfile: services/device-service/deployment/Dockerfile
    container_name: field-device-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: field
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-field
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
      # Alarm durum tablosu (device_alarms) — field timescale
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
    # Wattox PCS BMS port sunucusu — standalone container stack'ten
    # (host.docker.internal) BSC→PCS connector'ın bağlanması için host'a açılır.
    ports:
      - "15502:15502"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../services/device-service/deployment/config-field:/app/config-field:ro
    networks:
      - field-network
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Field tier otomasyon (management-service) — R-06 recovery kuralı.
  management-service:
    build:
      context: ../
      dockerfile: services/management-service/deployment/Dockerfile
    container_name: field-management-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: field
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-field
      MANAGEMENT_RULES_PATH: /app/config/rules.json
      MANAGEMENT_EVALUATION_INTERVAL_MS: ${MANAGEMENT_EVALUATION_INTERVAL_MS:-10000}
      # WS4 D4: konteyner komut kanalı — field web-service proxy rotası
      # (opsiyonel; yoksa container-command aksiyonu kademeli fail olur)
      FIELD_WEB_SERVICE_URL: ${FIELD_WEB_SERVICE_URL:-http://web-service:5002}
      FIELD_ID: ${FIELD_ID:-}
      FIELD_INTERNAL_API_TOKEN: ${FIELD_INTERNAL_API_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      device-service:
        condition: service_started
    volumes:
      - ../services/management-service/deployment/config-field:/app/config:ro
      - ../services/device-service/deployment/config-field:/app/config-field:ro
    networks:
      - field-network
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-service:
    build:
      context: ../
      dockerfile: services/web-service/deployment/Dockerfile
    container_name: field-web-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: field
      PORT: 5002
      HOST: 0.0.0.0
      # 2026-08-28: tek saha modeli — FIELD_ID env'den zorunlu (UUID);
      # açılışta fields tablosuna seed edilir (elle saha oluşturma yok).
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
      FIELD_NAME: ${FIELD_NAME:-Saha}
      # Faz 6 T6.1 debug flag'i: false ise MFA zorunluluğu kapalı (üretimde true)
      MFA_ENABLED: ${MFA_ENABLED:-true}
      # Faz 1 T1.6: field tier fail-fast — dev default secret ile acilis REDDEDILIR
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env degiskeni zorunlu (>=32 karakter)}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD zorunlu}
      SEED_BOSS_PASSWORD: ${SEED_BOSS_PASSWORD:?SEED_BOSS_PASSWORD zorunlu}
      SEED_GUEST_PASSWORD: ${SEED_GUEST_PASSWORD:?SEED_GUEST_PASSWORD zorunlu}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      # Field tier komut çözümlemesi: PCS config'leri config-field'da
      # (Wattox register map — konteyner config'leri DEĞİL).
      DEVICE_CONFIG_DIR: /app/config-field
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "1 day"
      TIMESCALE_RETENTION_AFTER: "90 days"
      # Boss Faz 3: field uplink (opsiyonel — FIELD_UPLINK_ENABLED=false ise kapalı)
      FIELD_UPLINK_ENABLED: ${FIELD_UPLINK_ENABLED:-false}
      FIELD_UPLINK_WS_URL: ${FIELD_UPLINK_WS_URL:-ws://host.docker.internal:5003/ws/field}
      FIELD_UPLINK_TOKEN: ${FIELD_UPLINK_TOKEN:-}
      # Boss'tan gelen field-app tünel akışlarının upstream'leri (loopback)
      TUNNEL_FIELD_API_UPSTREAM: ${TUNNEL_FIELD_API_UPSTREAM:-http://web-service:5002}
      TUNNEL_FIELD_STATIC_UPSTREAM: ${TUNNEL_FIELD_STATIC_UPSTREAM:-http://web:80}
      # WS4 D3: programatik kanal (management-service) gizli token'ı —
      # env yoksa internal yol KAPALI (fail-closed; Bearer admin/teknik açık)
      FIELD_INTERNAL_API_TOKEN: ${FIELD_INTERNAL_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5002"
    volumes:
      - ../services/device-service/deployment/config-field:/app/config-field:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - field-network
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../
      dockerfile: apps/field/deployment/Dockerfile
      args:
        # 2026-08-28: tek saha — VITE_FIELD_ID build sırasında SPA'ya gömülür
        VITE_FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
    container_name: field-web
    environment:
      NODE_ENV: production
    ports:
      - "88:80"
    depends_on:
      - web-service
    networks:
      - field-network
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  field-timescale-data:
  field-redis-data:

networks:
  field-network:
    driver: bridge
