name: field-stack

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: field-timescaledb
    command:
      - -cshared_buffers=256MB
      - -cwork_mem=4MB
      - -ceffective_cache_size=768MB
      - -cmaintenance_work_mem=64MB
      - -cmax_connections=50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: battery
    ports:
      - "5434:5432"
    volumes:
      - field-timescale-data:/var/lib/postgresql/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battery"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: field-redis
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6381:6379"
    volumes:
      - field-redis-data:/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-service:
    build:
      context: ../
      dockerfile: services/web-service/deployment/Dockerfile
    container_name: field-web-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: field
      PORT: 5002
      HOST: 0.0.0.0
      # 2026-08-28: tek saha modeli — FIELD_ID env'den zorunlu (UUID);
      # açılışta fields tablosuna seed edilir (elle saha oluşturma yok).
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
      FIELD_NAME: ${FIELD_NAME:-Saha}
      # Faz 6 T6.1 debug flag'i: false ise MFA zorunluluğu kapalı (üretimde true)
      MFA_ENABLED: ${MFA_ENABLED:-true}
      # Faz 1 T1.6: field tier fail-fast — dev default secret ile acilis REDDEDILIR
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env degiskeni zorunlu (>=32 karakter)}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD zorunlu}
      SEED_BOSS_PASSWORD: ${SEED_BOSS_PASSWORD:?SEED_BOSS_PASSWORD zorunlu}
      SEED_GUEST_PASSWORD: ${SEED_GUEST_PASSWORD:?SEED_GUEST_PASSWORD zorunlu}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "1 day"
      TIMESCALE_RETENTION_AFTER: "90 days"
    ports:
      - "5002:5002"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - field-network
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../
      dockerfile: apps/field/deployment/Dockerfile
      args:
        # 2026-08-28: tek saha — VITE_FIELD_ID build sırasında SPA'ya gömülür
        VITE_FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
    container_name: field-web
    environment:
      NODE_ENV: production
    ports:
      - "88:80"
    depends_on:
      - web-service
    networks:
      - field-network
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  field-timescale-data:
  field-redis-data:

networks:
  field-network:
    driver: bridge
