name: field-stack

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: field-timescaledb-dev
    command:
      - -cshared_buffers=256MB
      - -cwork_mem=4MB
      - -ceffective_cache_size=768MB
      - -cmaintenance_work_mem=64MB
      - -cmax_connections=50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: battery
    ports:
      - "5434:5432"
    volumes:
      - field-timescale-data-dev:/var/lib/postgresql/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battery"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: field-redis-dev
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "6381:6379"
    volumes:
      - field-redis-data-dev:/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Field tier device-service — Wattox PCS'ler (PCS-WATTOX-MIMARISI.md).
  device-service:
    build:
      context: ../
      dockerfile: services/device-service/deployment/Dockerfile.dev
    container_name: field-device-service-dev
    environment:
      NODE_ENV: development
      SERVICE_TIER: field
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-field
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
      # Alarm durum tablosu (device_alarms) — field timescale
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
    # Wattox PCS BMS port sunucusu — standalone container stack'ten
    # (host.docker.internal) BSC→PCS connector'ın bağlanması için host'a açılır.
    ports:
      - "15502:15502"
    volumes:
      - ../services/device-service/src:/app/services/device-service/src
      - ../services/device-service/run.ts:/app/services/device-service/run.ts
      - ../services/device-service/deployment/config-field:/app/config-field:ro
      - ../packages/core/src:/app/packages/core/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/shared-utils/src:/app/packages/shared-utils/src
      - ../packages/simulators/src:/app/packages/simulators/src
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Field tier otomasyon (management-service) — R-06 recovery kuralı.
  # FIELD-MANEVRA-KATALOGU-REV01-MIMARISI.md §5.
  management-service:
    build:
      context: ../
      dockerfile: services/management-service/deployment/Dockerfile.dev
    container_name: field-management-service-dev
    environment:
      NODE_ENV: development
      SERVICE_TIER: field
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-field
      MANAGEMENT_RULES_PATH: /app/config/rules.json
      MANAGEMENT_EVALUATION_INTERVAL_MS: ${MANAGEMENT_EVALUATION_INTERVAL_MS:-10000}
      # WS4 D4: konteyner komut kanalı (opsiyonel)
      FIELD_WEB_SERVICE_URL: ${FIELD_WEB_SERVICE_URL:-http://web-service:5002}
      FIELD_ID: ${FIELD_ID:-}
      FIELD_INTERNAL_API_TOKEN: ${FIELD_INTERNAL_API_TOKEN:-}
    volumes:
      - ../services/management-service/src:/app/services/management-service/src
      - ../services/management-service/run.ts:/app/services/management-service/run.ts
      - ../services/management-service/deployment/config-field:/app/config:ro
      - ../services/device-service/deployment/config-field:/app/config-field:ro
      - ../packages/core/src:/app/packages/core/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/result/src:/app/packages/result/src
      - ../packages/platform/messaging/src:/app/packages/platform/messaging/src
      - ../packages/platform/commands/src:/app/packages/platform/commands/src
      - ../packages/platform/logging/src:/app/packages/platform/logging/src
      - ../packages/tamper-logger/src:/app/packages/tamper-logger/src
    depends_on:
      redis:
        condition: service_healthy
      device-service:
        condition: service_started
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-service:
    build:
      context: ../
      dockerfile: services/web-service/deployment/Dockerfile.dev
    container_name: field-web-service-dev
    environment:
      NODE_ENV: development
      SERVICE_TIER: field
      PORT: 5002
      HOST: 0.0.0.0
      # 2026-08-28: tek saha modeli — FIELD_ID env'den zorunlu (UUID);
      # açılışta fields tablosuna seed edilir (elle saha oluşturma yok).
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
      FIELD_NAME: ${FIELD_NAME:-Saha}
      # Faz 6 T6.1 debug flag'i: false ise MFA zorunluluğu kapalı (üretimde true)
      MFA_ENABLED: ${MFA_ENABLED:-true}
      # Faz 1 T1.6: field tier fail-fast — dev default secret ile acilis REDDEDILIR
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu (>=32 karakter — openssl rand -hex 32)}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD zorunlu (>=8 karakter)}
      SEED_BOSS_PASSWORD: ${SEED_BOSS_PASSWORD:?SEED_BOSS_PASSWORD zorunlu (>=8 karakter)}
      SEED_GUEST_PASSWORD: ${SEED_GUEST_PASSWORD:?SEED_GUEST_PASSWORD zorunlu (>=8 karakter)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      # Field tier komut çözümlemesi: PCS config'leri config-field'da
      # (Wattox register map — konteyner config'leri DEĞİL).
      DEVICE_CONFIG_DIR: /app/config-field
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "1 day"
      TIMESCALE_RETENTION_AFTER: "90 days"
      # Boss Faz 3: field uplink (opsiyonel — FIELD_UPLINK_ENABLED=false ise kapalı)
      FIELD_UPLINK_ENABLED: ${FIELD_UPLINK_ENABLED:-false}
      FIELD_UPLINK_WS_URL: ${FIELD_UPLINK_WS_URL:-ws://host.docker.internal:5003/ws/field}
      FIELD_UPLINK_TOKEN: ${FIELD_UPLINK_TOKEN:-}
      # Boss'tan gelen field-app tünel akışlarının upstream'leri (loopback)
      TUNNEL_FIELD_API_UPSTREAM: ${TUNNEL_FIELD_API_UPSTREAM:-http://web-service:5002}
      # WS4 D3: programatik kanal gizli token'ı (yoksa internal yol KAPALI)
      FIELD_INTERNAL_API_TOKEN: ${FIELD_INTERNAL_API_TOKEN:-}
      # Boss Faz 3: field app dev (Vite) tünel upstream'i base önekini taşır —
      # VITE_TUNNEL_BASE ile birebir (/fields/<FIELD_ID>/ui).
      TUNNEL_FIELD_STATIC_UPSTREAM: ${TUNNEL_FIELD_STATIC_UPSTREAM:-http://web:5174/fields/${FIELD_ID}/ui}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5002"
    volumes:
      - ../services/web-service/src:/app/services/web-service/src
      - ../services/web-service/run.ts:/app/services/web-service/run.ts
      - ../services/device-service/deployment/config-field:/app/config-field:ro
      - ../packages/core/src:/app/packages/core/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/shared-utils/src:/app/packages/shared-utils/src
      - ../packages/platform/logging/src:/app/packages/platform/logging/src
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../
      dockerfile: apps/field/deployment/Dockerfile.dev
    container_name: field-web-dev
    environment:
      NODE_ENV: development
      VITE_FIELD_SERVICE_URL: http://web-service:5002
      # Boss Faz 3: boss iframe'inden tünel erişimi için Vite base'i —
      # yalnızca boss demosu gerektirdiğinde .env.field'da ayarlanır
      # (ör. /fields/<FIELD_ID>/ui/). Standalone dev/e2e'de BOŞ kalır:
      # SPA "/" tabanında yaşar ve form girişi çalışır (tünel modunda
      # persistTokens NO-OP'tur — kimlik field_session cookie'sindedir).
      VITE_TUNNEL_BASE: ${VITE_TUNNEL_BASE:-}
      # 2026-08-28: tek saha — frontend giriş sonrası doğrudan bu ID'ye gider
      # (saha listesi çözümü kaldırıldı). Backend FIELD_ID ile aynı kaynak.
      VITE_FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
    ports:
      - "5174:5174"
    volumes:
      - ../apps/field/src:/app/apps/field/src
      - ../apps/field/vite.config.ts:/app/apps/field/vite.config.ts
      - ../apps/field/tsconfig.json:/app/apps/field/tsconfig.json
      - ../apps/field/index.html:/app/apps/field/index.html
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../tsconfig.base.json:/app/tsconfig.base.json
      - /app/apps/field/node_modules
      - /app/node_modules
    depends_on:
      - web-service
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  field-timescale-data-dev:
  field-redis-data-dev:

networks:
  field-network:
    driver: bridge
