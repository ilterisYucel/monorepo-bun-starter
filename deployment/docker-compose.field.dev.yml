name: field-stack

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: field-timescaledb-dev
    command:
      - -cshared_buffers=256MB
      - -cwork_mem=4MB
      - -ceffective_cache_size=768MB
      - -cmaintenance_work_mem=64MB
      - -cmax_connections=50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: battery
    ports:
      - "5434:5432"
    volumes:
      - field-timescale-data-dev:/var/lib/postgresql/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battery"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: field-redis-dev
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "6381:6379"
    volumes:
      - field-redis-data-dev:/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-service:
    build:
      context: ../
      dockerfile: services/web-service/deployment/Dockerfile.dev
    container_name: field-web-service-dev
    environment:
      NODE_ENV: development
      SERVICE_TIER: field
      PORT: 5002
      HOST: 0.0.0.0
      # 2026-08-28: tek saha modeli — FIELD_ID env'den zorunlu (UUID);
      # açılışta fields tablosuna seed edilir (elle saha oluşturma yok).
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
      FIELD_NAME: ${FIELD_NAME:-Saha}
      # Faz 6 T6.1 debug flag'i: false ise MFA zorunluluğu kapalı (üretimde true)
      MFA_ENABLED: ${MFA_ENABLED:-true}
      # Faz 1 T1.6: field tier fail-fast — dev default secret ile acilis REDDEDILIR
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu (>=32 karakter — openssl rand -hex 32)}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD zorunlu (>=8 karakter)}
      SEED_BOSS_PASSWORD: ${SEED_BOSS_PASSWORD:?SEED_BOSS_PASSWORD zorunlu (>=8 karakter)}
      SEED_GUEST_PASSWORD: ${SEED_GUEST_PASSWORD:?SEED_GUEST_PASSWORD zorunlu (>=8 karakter)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      DEVICE_CONFIG_DIR: /app/services/device-service/config
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "1 day"
      TIMESCALE_RETENTION_AFTER: "90 days"
    ports:
      - "5002:5002"
    volumes:
      - ../services/web-service/src:/app/services/web-service/src
      - ../services/web-service/run.ts:/app/services/web-service/run.ts
      - ../packages/core/src:/app/packages/core/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/shared-utils/src:/app/packages/shared-utils/src
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../
      dockerfile: apps/field/deployment/Dockerfile.dev
    container_name: field-web-dev
    environment:
      NODE_ENV: development
      VITE_FIELD_SERVICE_URL: http://web-service:5002
      # 2026-08-28: tek saha — frontend giriş sonrası doğrudan bu ID'ye gider
      # (saha listesi çözümü kaldırıldı). Backend FIELD_ID ile aynı kaynak.
      VITE_FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID)}
    ports:
      - "5174:5174"
    volumes:
      - ../apps/field/src:/app/apps/field/src
      - ../apps/field/vite.config.ts:/app/apps/field/vite.config.ts
      - ../apps/field/tsconfig.json:/app/apps/field/tsconfig.json
      - ../apps/field/index.html:/app/apps/field/index.html
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../tsconfig.base.json:/app/tsconfig.base.json
      - /app/apps/field/node_modules
      - /app/node_modules
    depends_on:
      - web-service
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  field-timescale-data-dev:
  field-redis-data-dev:

networks:
  field-network:
    driver: bridge
