name: field-stack

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: field-timescaledb-dev
    command:
      - -cshared_buffers=256MB
      - -cwork_mem=4MB
      - -ceffective_cache_size=768MB
      - -cmaintenance_work_mem=64MB
      - -cmax_connections=50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: battery
    ports:
      - "5434:5432"
    volumes:
      - field-timescale-data-dev:/var/lib/postgresql/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battery"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: field-redis-dev
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6381:6379"
    volumes:
      - field-redis-data-dev:/data
    networks:
      - field-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-service:
    build:
      context: ../
      dockerfile: packages/services/web-service/deployment/Dockerfile.dev
    container_name: field-web-service-dev
    environment:
      NODE_ENV: development
      SERVICE_TIER: field
      PORT: 5002
      HOST: 0.0.0.0
      JWT_SECRET: dev-secret-change-in-production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      DEVICE_CONFIG_DIR: /app/packages/services/device-service/config
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "1 day"
      TIMESCALE_RETENTION_AFTER: "90 days"
    ports:
      - "5002:5002"
    volumes:
      - ../packages/services/web-service/src:/app/packages/services/web-service/src
      - ../packages/services/web-service/run.ts:/app/packages/services/web-service/run.ts
      - ../packages/core/src:/app/packages/core/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/shared-utils/src:/app/packages/shared-utils/src
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../
      dockerfile: apps/field/deployment/Dockerfile.dev
    container_name: field-web-dev
    environment:
      NODE_ENV: development
      VITE_FIELD_SERVICE_URL: http://web-service:5002
    ports:
      - "5174:5174"
    volumes:
      - ../apps/field/src:/app/apps/field/src
      - ../apps/field/vite.config.ts:/app/apps/field/vite.config.ts
      - ../apps/field/tsconfig.json:/app/apps/field/tsconfig.json
      - ../apps/field/index.html:/app/apps/field/index.html
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../tsconfig.base.json:/app/tsconfig.base.json
      - /app/apps/field/node_modules
      - /app/node_modules
    depends_on:
      - web-service
    networks:
      - field-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  field-timescale-data-dev:
  field-redis-data-dev:

networks:
  field-network:
    driver: bridge
