# Host port override — yalnız hata ayıklama için (SPEC UC-1: varsayılan kapalı).
# Kullanım:
#   docker compose --env-file deployment/v2/dev/simulator-app/.env \
#     -f deployment/v2/dev/simulator-app/docker-compose.yml \
#     -f deployment/v2/dev/simulator-app/docker-compose.host-ports.yml up -d
services:
  sim-lab:
    ports:
      # Konteyner N: 20000 + (N-1)×100 + {1-2 BSC, 5-9 konnektör, 11-18 HVAC,
      #   31-32 DC şalter, 41-43 DC metre/çıkış, 51 PM5340, 52 IMD, 53 FSS, 54 panel IO}
      - "20001-20054:20001-20054"
      - "20101-20154:20101-20154"
      - "20201-20254:20201-20254"
      - "20301-20354:20301-20354"
      - "20401-20454:20401-20454"
      - "20501-20554:20501-20554"
      - "20601-20654:20601-20654"
      - "20701-20754:20701-20754"
      - "20801-20854:20801-20854"
      # Saha: PCS-n EMS 30000+n, PCS-n BMS 30100+n, OG köşk 3020x
      - "30001-30018:30001-30018"
      - "30101-30118:30101-30118"
      - "30201-30218:30201-30218"
      # --- Legacy test alias'ları: entegrasyon testleri eski port adlarını kullanır ---
      - "1502:30001"    # PCS-1 EMS (eski 502 alias)
      - "1503:30002"    # PCS-2 EMS
      - "1504:30003"    # PCS-3 EMS (container2)
      - "1505:30004"    # PCS-4 EMS
      - "15501:20001"   # BSC-1 (C1)
      - "15504:20051"   # PM5340-1 (C1)
      - "15511:20011"   # HVAC-1 (C1)
      - "15536:20052"   # IMD-1 (C1)
      - "15540:30201"   # DEMO-MV-1
      - "15541:30202"   # DEMO-MV-2
      - "5030:20041"    # DC-METER-1 (C1)
