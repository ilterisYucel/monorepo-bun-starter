name: v2-dev-demo-container2

# DEMO-FIELD (v2) — İKİNCİ konteyner stack'i (UC-13 istasyon bess2).
#
# Her konteyner KENDİ docker-compose'u + kendi config kopyalarıyla çalışır
# (kapsülleme; kardeş app `../` referansı YOK). Bu stack `demo-bridge` ağına
# (birinci container compose'u tanımlar) external olarak katılır.
#
# ÇALIŞTIRMA SIRASI: ÖNCE `container` compose (demo-bridge), SONRA bu, SONRA field.
#
# .env: deployment/v2/dev/container2/.env  (şablon: .env.example)

services:
  container2-timescaledb:
    image: timescale/timescaledb:latest-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: demo-container2-timescaledb
    command:
      - -cshared_buffers=128MB
      - -cwork_mem=16MB
      - -cmax_connections=50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: battery
    volumes:
      - demo-container2-timescale-data:/var/lib/postgresql/data
    networks:
      container2-network:
        aliases: [timescaledb]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battery"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  container2-redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: demo-container2-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    volumes:
      - demo-container2-redis-data:/data
    networks:
      container2-network:
        aliases: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  container2-device-service:
    build:
      context: ../../../../
      dockerfile: services/device-service/deployment/Dockerfile.dev
    container_name: demo-container2-device-service
    environment:
      NODE_ENV: development
      REDIS_HOST: container2-redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      CONTAINER_ID: container-2
      POSTGRES_HOST: container2-timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      PCS_BMS_TARGET_HOST: ${PCS_BMS_TARGET_HOST:-field-device-service}
      PCS_EMS_TARGET_HOST: ${PCS_EMS_TARGET_HOST:-field-device-service}
      # Station 2 (BESS#6-9) → PCS-1'in BMS yüzü
      PCS_BMS_TARGET_PORT: ${PCS_BMS_TARGET_PORT:-15502}
      DEBUG_INJECT_ENABLED: ${DEBUG_INJECT_ENABLED:-true}
      DEBUG_INJECT_PORT: 15592
      SIMULATOR_BIND_HOST: 0.0.0.0
    volumes:
      - ../../../../services/device-service/src:/app/services/device-service/src
      - ../../../../services/device-service/run.ts:/app/services/device-service/run.ts
      - ./device-configs:/app/config-docker:ro
      - ../../../../packages/core/src:/app/packages/core/src
      - ../../../../packages/shared-types/src:/app/packages/shared-types/src
      - ../../../../packages/shared-utils/src:/app/packages/shared-utils/src
      - ../../../../packages/simulators/src:/app/packages/simulators/src
    # Yalnızca DebugInjector yayınlanır (veri ayrımı doğrulaması). Modbus
    # simülatör portları birinci konteyner ile çakışmasın diye yayınlanmaz.
    ports:
      - "127.0.0.1:15592:15592"   # DebugInjector (dev-only)
    depends_on:
      container2-redis:
        condition: service_healthy
      container2-timescaledb:
        condition: service_healthy
    networks:
      - container2-network
      - demo-bridge
    logging: *logging

  container2-data-service:
    build:
      context: ../../../../
      dockerfile: services/data-service/deployment/Dockerfile.dev
    container_name: demo-container2-data-service
    environment:
      NODE_ENV: development
      REDIS_HOST: container2-redis
      REDIS_PORT: 6379
      TIMESCALE_HOST: container2-timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: password
      TIMESCALE_DATABASE: battery
      TIMESCALE_RETENTION_AFTER: "24 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
    volumes:
      - ../../../../services/data-service/src:/app/services/data-service/src
      - ../../../../services/data-service/run.ts:/app/services/data-service/run.ts
      - ../../../../packages/core/src:/app/packages/core/src
      - ../../../../packages/shared-types/src:/app/packages/shared-types/src
      - ../../../../packages/shared-utils/src:/app/packages/shared-utils/src
    depends_on:
      container2-redis:
        condition: service_healthy
      container2-timescaledb:
        condition: service_healthy
    networks:
      - container2-network
    logging: *logging

  # Kuyruk tüketicisi (MANAGEMENT) — demo'da kural ÇALIŞTIRMAZ (disabled rules).
  container2-management-service:
    build:
      context: ../../../../
      dockerfile: services/management-service/deployment/Dockerfile.dev
    container_name: demo-container2-management-service
    environment:
      NODE_ENV: development
      SERVICE_TIER: container
      REDIS_HOST: container2-redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      MANAGEMENT_RULES_PATH: /app/config/rules.json
      MANAGEMENT_EVALUATION_INTERVAL_MS: ${MANAGEMENT_EVALUATION_INTERVAL_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../../../../services/management-service/src:/app/services/management-service/src
      - ../../../../services/management-service/run.ts:/app/services/management-service/run.ts
      - ./rules:/app/config:ro
      - ./device-configs:/app/config-docker:ro
      - ../../../../packages/core/src:/app/packages/core/src
      - ../../../../packages/shared-types/src:/app/packages/shared-types/src
      - ../../../../packages/result/src:/app/packages/result/src
      - ../../../../packages/platform/messaging/src:/app/packages/platform/messaging/src
      - ../../../../packages/platform/commands/src:/app/packages/platform/commands/src
      - ../../../../packages/platform/logging/src:/app/packages/platform/logging/src
      - ../../../../packages/tamper-logger/src:/app/packages/tamper-logger/src
    depends_on:
      container2-redis:
        condition: service_healthy
      container2-device-service:
        condition: service_started
    networks:
      - container2-network
    logging: *logging

  container2-web-service:
    build:
      context: ../../../../
      dockerfile: services/web-service/deployment/Dockerfile.dev
    container_name: demo-container2-web-service
    environment:
      NODE_ENV: development
      PORT: 5001
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu (>=32 karakter — openssl rand -hex 32)}
      ACCESS_TOKEN_EXPIRY_SECONDS: ${ACCESS_TOKEN_EXPIRY_SECONDS:-900}
      MFA_ENABLED: ${MFA_ENABLED:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD zorunlu (>=8 karakter)}
      SEED_BOSS_PASSWORD: ${SEED_BOSS_PASSWORD:?SEED_BOSS_PASSWORD zorunlu (>=8 karakter)}
      SEED_GUEST_PASSWORD: ${SEED_GUEST_PASSWORD:?SEED_GUEST_PASSWORD zorunlu (>=8 karakter)}
      REDIS_HOST: container2-redis
      REDIS_PORT: 6379
      POSTGRES_HOST: container2-timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      DEVICE_CONFIG_DIR: /app/config-docker
      MANEUVER_CONFIG_DIR: /app/maneuver-config
      FIELD_CONNECT_ENABLED: ${FIELD_CONNECT_ENABLED:-true}
      FIELD_WS_URL: ${FIELD_WS_URL:-ws://field-web-service:5002/ws/container}
      CONTAINER_TOKEN: ${CONTAINER2_TOKEN:-}
      CONTAINER_ID: container-2
      # Field→konteyner tünel istekleri bu web-service'e yerel olarak çözülür
      # (servis adı container2-web-service; `container-web-service` bu ağda YOK).
      TUNNEL_API_UPSTREAM: ${TUNNEL_API_UPSTREAM:-http://container2-web-service:5001}
      TUNNEL_TELEMETRY_INTERVAL_MS: ${TUNNEL_TELEMETRY_INTERVAL_MS:-5000}
      TUNNEL_STATIC_UPSTREAM: ${TUNNEL_STATIC_UPSTREAM:-http://container2-web-service:5001}
    volumes:
      - ../../../../services/web-service/src:/app/services/web-service/src
      - ../../../../packages/ws-tunnel/src:/app/packages/ws-tunnel/src
      - ../../../../services/web-service/run.ts:/app/services/web-service/run.ts
      - ./device-configs:/app/config-docker:ro
      - ./maneuvers:/app/maneuver-config:ro
      - ../../../../packages/core/src:/app/packages/core/src
      - ../../../../packages/shared-types/src:/app/packages/shared-types/src
      - ../../../../packages/shared-utils/src:/app/packages/shared-utils/src
      - ../../../../packages/platform/commands/src:/app/packages/platform/commands/src
      - ../../../../packages/result/src:/app/packages/result/src
      - ../../../../packages/platform/logging/src:/app/packages/platform/logging/src
    depends_on:
      container2-redis:
        condition: service_healthy
      container2-timescaledb:
        condition: service_healthy
    networks:
      - container2-network
      - demo-bridge
    logging: *logging

volumes:
  demo-container2-timescale-data:
  demo-container2-redis-data:

networks:
  container2-network:
    name: v2-dev-demo-container2-network
    driver: bridge
  demo-bridge:
    name: v2-dev-demo-bridge
    external: true
