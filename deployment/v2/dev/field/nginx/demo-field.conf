# DEMO-FIELD (v2/dev) — field SPA nginx yapılandırması.
#
# Kapsülleme: bu dosya app klasöründe yaşar (deployment/v2/dev/field/nginx/) ve
# compose'da imajdaki baked conf'un üzerine mount edilir.
#
# Hub alias sözleşmesi (WS-TUNNEL-HUB-CONSUMER-P3):
#   /peers/*                     → hub-servis (opak peer/servis erişimi, WS upgrade)
#   /containers/<cid>/ui/*       → hub-servis /peers/<cid>/services/container-api/*
# Eski `/api` + `/containers/*` yolları field web-service'e gider (API).

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS — upstream'ler yeniden oluşunca (yeni IP) bayat
  # adres kullanılmasın. Static proxy_pass açılışta bir kez çözülür ve
  # konteyner recreate sonrası 502 üretir; değişkenli proxy_pass + resolver
  # her istekte taze çözer.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Gömülü tünel base (/fields/<fid>/ui/) ile doğrudan erişim (:8088):
  # asset'ler bu önekli yoldan istenir — önek soyulup SPA kökünden servis edilir.
  location ~ ^/fields/[^/]+/ui/(.*)$ {
    try_files /$1 /index.html;
  }

  # Hub-servis — opak peer/servis erişimi (aynı origin).
  location /peers/ {
    set $hub_upstream http://hub-servis:5003;
    proxy_pass $hub_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Alias: eski konteyner UI yolu → hub peer/servis yolu (SPA base değişmez).
  location ~ ^/containers/(?<cid>[^/]+)/ui/(.*)$ {
    proxy_pass http://hub-servis:5003/peers/$cid/services/container-api/$2;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api {
    set $field_ws_upstream http://field-web-service:5002;
    proxy_pass $field_ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
  }

  location /containers/ {
    set $field_ws_upstream http://field-web-service:5002;
    proxy_pass $field_ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
