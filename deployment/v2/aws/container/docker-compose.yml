name: v2-aws-edge-container

# =============================================================================
# AWS Edge stack (DEMO-FIELD / v2) — Makine A — CONTAINER yarısı
#
# Field yarısı ayrı compose projesidir (deployment/v2/aws/field/docker-compose.yml)
# ama aynı makinede çalışır ve ORTAK Docker ağını (v2-aws-edge-network) paylaşır.
# Konteyner → field bağlantısı network içi servis adıyla kurulur.
#
# ÇALIŞTIRMA SIRASI: ÖNCE bu compose (ortak ağı tanımlar), SONRA field compose.
#
# UI'suz konteyner: container-web servisi YOK.
#
# FLAG (TLS): FIELD_WS_URL şu an ws:// (TLS'siz) — demo kabulü. Üretimde
# wss:// + ALB/nginx + ACM zorunlu; token'lar düz WS üzerinde taşınmamalı.
#
# --- AWS Güvenlik Grubu (Makine A) portları ---
# AÇIK gerekli : 22 (SSH, ofis IP'si)
# AÇIK opsiyonel: 88 (field UI)
# AÇILMAZ     : 5432/5434/6379/6381 (DB/Redis — 127.0.0.1'e bağlı),
#               5001/5002 (web-service'ler — yalnızca network içi).
# B'ye erişim : outbound 5003'e izin (varsayılan egress yeterli).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Container tier altyapısı
  # ---------------------------------------------------------------------------
  container-timescaledb:
    image: timescale/timescaledb:latest-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: aws-container-timescaledb
    command:
      - -cshared_buffers=768MB
      - -cwork_mem=8MB
      - -ceffective_cache_size=5GB
      - -cmaintenance_work_mem=256MB
      - -cmax_connections=30
      - -cwal_buffers=16MB
      - -ccheckpoint_completion_target=0.9
      - -csynchronous_commit=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # Tek paylaşımlı timescale'de konteyner-1 tier DB'si (container2 ayrı DB).
      POSTGRES_DB: container1
    ports:
      # AWS SG: AÇILMAZ — yalnızca host üstünde debug (psql).
      - "127.0.0.1:5432:5432"
    volumes:
      - aws-container-timescale-data:/var/lib/postgresql/data
    networks:
      edge-network:
        aliases:
          # device-service PG bağlantısı config-docker/service.json'daki
          # HARDCODED "timescaledb" host'unu kullanır (DeviceConfigLoader env
          # override desteklemez) — alias olmadan DNS ENOTFOUND alır.
          - timescaledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d container1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  container-redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: aws-container-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      # AWS SG: AÇILMAZ — yalnızca host üstünde debug (redis-cli).
      - "127.0.0.1:6379:6379"
    volumes:
      - aws-container-redis-data:/data
    networks:
      - edge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  container-device-service:
    build:
      context: ../../../../../
      dockerfile: services/device-service/deployment/Dockerfile
    container_name: aws-container-device-service
    environment:
      NODE_ENV: production
      REDIS_HOST: container-redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      CONTAINER_ID: ${CONTAINER_ID:-container-1}
      # Alarm durum tablosu (device_alarms) + logger timescale sink
      POSTGRES_HOST: container-timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      # BSC→PCS connector BMS hedefi — field PCS'ler aynı edge-network'te
      # field-device-service'te koşar (BSC-PCS-CONNECTOR-MIMARISI §6).
      PCS_BMS_TARGET_HOST: ${PCS_BMS_TARGET_HOST:-field-device-service}
      PCS_BMS_TARGET_PORT: ${PCS_BMS_TARGET_PORT:-15502}
    depends_on:
      container-redis:
        condition: service_healthy
      container-timescaledb:
        condition: service_healthy
    volumes:
      - ./device-configs:/app/config-docker:ro
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  container-data-service:
    build:
      context: ../../../../../
      dockerfile: services/data-service/deployment/Dockerfile
    container_name: aws-container-data-service
    environment:
      NODE_ENV: production
      REDIS_HOST: container-redis
      REDIS_PORT: 6379
      TIMESCALE_HOST: container-timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: password
      TIMESCALE_DATABASE: battery
      TIMESCALE_RETENTION_AFTER: "24 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
    depends_on:
      container-redis:
        condition: service_healthy
      container-timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Konteyner tier management-service — DEMO'da kural ÇALIŞTIRMAZ (boş rules.json);
  # yalnızca MANAGEMENT kuyruğunu tüketip loglar. Gerçek kural seti test edilmeden
  # aktive edilmez.
  container-management-service:
    build:
      context: ../../../../../
      dockerfile: services/management-service/deployment/Dockerfile
    container_name: aws-container-management-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: container
      REDIS_HOST: container-redis
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      MANAGEMENT_RULES_PATH: /app/config/rules.json
      MANAGEMENT_EVALUATION_INTERVAL_MS: ${MANAGEMENT_EVALUATION_INTERVAL_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./rules:/app/config:ro
      - ./device-configs:/app/config-docker:ro
    depends_on:
      container-redis:
        condition: service_healthy
      container-device-service:
        condition: service_started
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  container-web-service:
    build:
      context: ../../../../../
      dockerfile: services/web-service/deployment/Dockerfile
    container_name: aws-container-web-service
    # AWS SG: ports YOK — yalnızca edge-network içi. Konteyner→field çıkışı da
    # bu servisten (outbound, SG gerekmez).
    environment:
      NODE_ENV: production
      PORT: 5001
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu (>=32 karakter — openssl rand -hex 32)}
      REDIS_HOST: container-redis
      REDIS_PORT: 6379
      POSTGRES_HOST: container-timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      DEVICE_CONFIG_DIR: /app/config-docker
      MANEUVER_CONFIG_DIR: /app/maneuver-config
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
      TIMESCALE_RETENTION_AFTER: "24 hours"
      # FieldConnector bootstrap — varsayılan AÇIK (konteyner→field linki;
      # kapatılırsa charge/discharge uzak BSC adımı rollback olur).
      FIELD_CONNECT_ENABLED: ${FIELD_CONNECT_ENABLED:-true}
      FIELD_WS_URL: ${FIELD_WS_URL:-ws://field-web-service:5002/ws/container}
      CONTAINER_TOKEN: ${CONTAINER_TOKEN:-}
      CONTAINER_ID: ${CONTAINER_ID:-container-1}
      # Faz 3 tünel loopback upstream'leri — AWS adlandirmalı (nginx conf'larıyla birebir).
      TUNNEL_API_UPSTREAM: ${TUNNEL_API_UPSTREAM:-http://container-web-service:5001}
      TUNNEL_STATIC_UPSTREAM: ${TUNNEL_STATIC_UPSTREAM:-http://container-web:80}
    volumes:
      - ./device-configs:/app/config-docker:ro
      - ./maneuvers:/app/maneuver-config:ro
    depends_on:
      container-redis:
        condition: service_healthy
      container-timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:5001/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aws-container-timescale-data:
  aws-container-redis-data:

networks:
  edge-network:
    name: v2-aws-edge-network
    driver: bridge
