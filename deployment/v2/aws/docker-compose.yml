name: v2-aws-demo

# =============================================================================
# AWS Edge DEMO stack (v2) — TEK compose: 2 konteyner + 1 field + ORTAK TimescaleDB
#
# Neden tek compose? AWS m6i.large (2 vCPU / 8 GiB) RAM'i yetsin diye 3 ayrı
# TimescaleDB yerine TEK instance + tier başına AYRI veritabanı:
#   field      → battery      (POSTGRES_DB, imaj oluşturur)
#   container-1→ container1   (initdb/001-create-dbs.sql)
#   container-2→ container2   (initdb/001-create-dbs.sql)
# Redis tier başına ayrı kalır (izolasyon; RAM maliyeti düşük).
#
# Ağ: tek bridge ağı (v2-aws-demo-network). Paylaşımlı timescale servisi
# `timescaledb` adını taşır + `field-timescaledb` alias'ı verilir (device-service
# `service.json` hostları env override kabul etmez — bu yüzden her tier'ın
# service.json'u kendi redis host'una (redis-c1/redis-c2/redis-field) ve DB adına
# göre güncellenmiştir).
#
# ÇALIŞTIRMA: tek compose — sıra yok.
#   cp deployment/v2/aws/.env.example deployment/v2/aws/.env   # doldur
#   docker compose --env-file deployment/v2/aws/.env -f deployment/v2/aws/docker-compose.yml up -d --build
#   tools/register-container.sh --container container-1,container-2 --station bess1,bess2 \
#     --token-var C1_CONTAINER_TOKEN,C2_CONTAINER_TOKEN \
#     --env deployment/v2/aws/.env --container-env deployment/v2/aws/.env --url http://localhost:88
#   (register:demo-integration script'i bunu tek çağrıda yapar)
#
# --- AWS Güvenlik Grubu (tek makine) ---
# AÇIK gerekli : 22 (SSH, ofis IP'si)
# AÇIK opsiyonel: 88 (demo saha UI)
# AÇILMAZ     : 5432/6379/6381/6382 (DB/Redis — 127.0.0.1'e bağlı), 5001/5002
#               (web-service'ler — yalnızca ağ içi)
# --- FLAG (TLS): ws:// (TLS'siz) — demo kabulü; üretimde wss:// + ALB/nginx + ACM.
# --- RAM notu: mem_limit toplamı ~6.7GB (8GB host). EC2 varsayılan swap YOK —
#     en az 2GB swapfile önerilir. Kaçak servis host'u OOM'lamasın diye cap'ler düşük.
# =============================================================================

x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-redis: &redis
  image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  command: >
    redis-server
    --maxmemory 192mb
    --maxmemory-policy noeviction
    --save ""
    --appendonly no
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 3s
    retries: 5
  restart: unless-stopped
  mem_limit: 96m
  networks:
    - edge-network
  logging: *log

services:
  # ===========================================================================
  # Ortak altyapı
  # ===========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: aws-demo-timescaledb
    command:
      - -cshared_buffers=512MB
      - -cwork_mem=8MB
      - -ceffective_cache_size=3GB
      - -cmaintenance_work_mem=128MB
      - -cmax_connections=60
      - -cwal_buffers=16MB
      - -ccheckpoint_completion_target=0.9
      - -csynchronous_commit=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: battery
    ports:
      # AWS SG: AÇILMAZ — yalnızca host üstünde debug (psql).
      - "127.0.0.1:5432:5432"
    volumes:
      - aws-demo-timescale-data:/var/lib/postgresql/data
      # İlk kurulumda container1/container2 DB'lerini açar (initdb, tek sefer).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      edge-network:
        aliases:
          # device-service service.json HARDCODED host'ları (env override yok).
          - timescaledb
          - field-timescaledb
          - container-timescaledb
          - container2-timescaledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battery"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 1536m
    logging: *log

  redis-field:
    <<: *redis
    container_name: aws-demo-redis-field
    command: >
      redis-server
      --maxmemory 192mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - aws-demo-redis-field-data:/data

  redis-c1:
    <<: *redis
    container_name: aws-demo-redis-c1
    ports:
      - "127.0.0.1:6379:6379"

  redis-c2:
    <<: *redis
    container_name: aws-demo-redis-c2
    ports:
      - "127.0.0.1:6382:6379"

  # ===========================================================================
  # FIELD tier (hub — konteyner kayıtları + boss uplink)
  # ===========================================================================
  field-device-service:
    build:
      context: ../../../
      dockerfile: services/device-service/deployment/Dockerfile
    container_name: aws-demo-field-device-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: field
      REDIS_HOST: redis-field
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-field
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID — uuidgen)}
      POSTGRES_HOST: field-timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
    volumes:
      - ./field/device-configs:/app/config-field:ro
    depends_on:
      redis-field:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 384m
    logging: *log

  field-data-service:
    build:
      context: ../../../
      dockerfile: services/data-service/deployment/Dockerfile
    container_name: aws-demo-field-data-service
    environment:
      NODE_ENV: production
      REDIS_HOST: redis-field
      REDIS_PORT: 6379
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: password
      TIMESCALE_DATABASE: battery
      TIMESCALE_RETENTION_AFTER: "24 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
    depends_on:
      redis-field:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 384m
    logging: *log

  field-management-service:
    build:
      context: ../../../
      dockerfile: services/management-service/deployment/Dockerfile
    container_name: aws-demo-field-management-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: field
      REDIS_HOST: redis-field
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-field
      MANAGEMENT_RULES_PATH: /app/config/rules.json
      MANAGEMENT_EVALUATION_INTERVAL_MS: ${MANAGEMENT_EVALUATION_INTERVAL_MS:-10000}
      FIELD_WEB_SERVICE_URL: ${FIELD_WEB_SERVICE_URL:-http://field-web-service:5002}
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID — uuidgen)}
      FIELD_INTERNAL_API_TOKEN: ${FIELD_INTERNAL_API_TOKEN:-}
    volumes:
      - ./field/rules:/app/config:ro
      - ./field/device-configs:/app/config-field:ro
    depends_on:
      redis-field:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 256m
    logging: *log

  field-web-service:
    build:
      context: ../../../
      dockerfile: services/web-service/deployment/Dockerfile
    container_name: aws-demo-field-web-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: field
      PORT: 5002
      HOST: 0.0.0.0
      FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID — uuidgen)}
      FIELD_NAME: ${FIELD_NAME:-Saha}
      MFA_ENABLED: ${MFA_ENABLED:-false}
      JWT_SECRET: ${FIELD_JWT_SECRET:?FIELD_JWT_SECRET zorunlu (>=32 karakter — openssl rand -hex 32)}
      SEED_ADMIN_PASSWORD: ${FIELD_SEED_ADMIN_PASSWORD:?FIELD_SEED_ADMIN_PASSWORD zorunlu (>=8 karakter)}
      SEED_BOSS_PASSWORD: ${FIELD_SEED_BOSS_PASSWORD:?FIELD_SEED_BOSS_PASSWORD zorunlu (>=8 karakter)}
      SEED_GUEST_PASSWORD: ${FIELD_SEED_GUEST_PASSWORD:?FIELD_SEED_GUEST_PASSWORD zorunlu (>=8 karakter)}
      REDIS_HOST: redis-field
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      DEVICE_CONFIG_DIR: /app/config-field
      MANEUVER_CONFIG_DIR: /app/maneuver-config
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
      TIMESCALE_RETENTION_AFTER: "24 hours"
      FIELD_INTERNAL_API_TOKEN: ${FIELD_INTERNAL_API_TOKEN:-}
      FIELD_UPLINK_ENABLED: ${FIELD_UPLINK_ENABLED:-false}
      FIELD_UPLINK_WS_URL: ${FIELD_UPLINK_WS_URL:-}
      FIELD_UPLINK_TOKEN: ${FIELD_UPLINK_TOKEN:-}
      TUNNEL_FIELD_API_UPSTREAM: ${TUNNEL_FIELD_API_UPSTREAM:-http://field-web-service:5002}
      TUNNEL_FIELD_STATIC_UPSTREAM: ${TUNNEL_FIELD_STATIC_UPSTREAM:-http://field-web:80}
    volumes:
      - ./field/device-configs:/app/config-field:ro
      - ./field/maneuvers:/app/maneuver-config:ro
    depends_on:
      redis-field:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:5002/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *log

  field-integration-service:
    build:
      context: ../../../
      dockerfile: services/integration-service/deployment/Dockerfile
    container_name: aws-demo-field-integration-service
    environment:
      NODE_ENV: production
      REDIS_HOST: redis-field
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: battery
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: password
      TIMESCALE_DATABASE: battery
      INTEGRATION_PLUGIN_DIR: /app/customer-plugins
      INTEGRATION_CONFIG_DIR: /app/config/plugins
      INTEGRATION_STATE_DIR: /app/data/plugins
    volumes:
      - ./field/plugins:/app/config/plugins:ro
      - aws-demo-integration-state-data:/app/data
    depends_on:
      redis-field:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 256m
    logging: *log

  field-web:
    build:
      context: ../../../
      dockerfile: apps/demo-field/deployment/Dockerfile
      args:
        VITE_FIELD_ID: ${FIELD_ID:?FIELD_ID zorunlu (UUID — uuidgen)}
    container_name: aws-demo-field-web
    environment:
      NODE_ENV: production
    ports:
      # AWS SG: OPSIYONEL — demo saha UI.
      - "88:80"
    volumes:
      - ./field/nginx/aws-demo-field.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      field-web-service:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 128m
    logging: *log

  # ===========================================================================
  # CONTAINER-1 tier
  # ===========================================================================
  c1-device-service:
    build:
      context: ../../../
      dockerfile: services/device-service/deployment/Dockerfile
    container_name: aws-demo-c1-device-service
    environment:
      NODE_ENV: production
      REDIS_HOST: redis-c1
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      CONTAINER_ID: container-1
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: container1
      PCS_BMS_TARGET_HOST: ${PCS_BMS_TARGET_HOST:-field-device-service}
      PCS_BMS_TARGET_PORT: ${PCS_BMS_TARGET_PORT:-15502}
    volumes:
      - ./container/device-configs:/app/config-docker:ro
    depends_on:
      redis-c1:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 384m
    logging: *log

  c1-data-service:
    build:
      context: ../../../
      dockerfile: services/data-service/deployment/Dockerfile
    container_name: aws-demo-c1-data-service
    environment:
      NODE_ENV: production
      REDIS_HOST: redis-c1
      REDIS_PORT: 6379
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: password
      TIMESCALE_DATABASE: container1
      TIMESCALE_RETENTION_AFTER: "24 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
    depends_on:
      redis-c1:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 384m
    logging: *log

  c1-management-service:
    build:
      context: ../../../
      dockerfile: services/management-service/deployment/Dockerfile
    container_name: aws-demo-c1-management-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: container
      REDIS_HOST: redis-c1
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      MANAGEMENT_RULES_PATH: /app/config/rules.json
      MANAGEMENT_EVALUATION_INTERVAL_MS: ${MANAGEMENT_EVALUATION_INTERVAL_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./container/rules:/app/config:ro
      - ./container/device-configs:/app/config-docker:ro
    depends_on:
      redis-c1:
        condition: service_healthy
      c1-device-service:
        condition: service_started
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 256m
    logging: *log

  c1-web-service:
    build:
      context: ../../../
      dockerfile: services/web-service/deployment/Dockerfile
    container_name: aws-demo-c1-web-service
    environment:
      NODE_ENV: production
      PORT: 5001
      HOST: 0.0.0.0
      JWT_SECRET: ${C1_JWT_SECRET:?C1_JWT_SECRET zorunlu (>=32 karakter — openssl rand -hex 32)}
      SEED_ADMIN_PASSWORD: ${C1_SEED_ADMIN_PASSWORD:?C1_SEED_ADMIN_PASSWORD zorunlu (>=8 karakter)}
      SEED_BOSS_PASSWORD: ${C1_SEED_BOSS_PASSWORD:?C1_SEED_BOSS_PASSWORD zorunlu (>=8 karakter)}
      SEED_GUEST_PASSWORD: ${C1_SEED_GUEST_PASSWORD:?C1_SEED_GUEST_PASSWORD zorunlu (>=8 karakter)}
      REDIS_HOST: redis-c1
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: container1
      DEVICE_CONFIG_DIR: /app/config-docker
      MANEUVER_CONFIG_DIR: /app/maneuver-config
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
      TIMESCALE_RETENTION_AFTER: "24 hours"
      FIELD_CONNECT_ENABLED: ${FIELD_CONNECT_ENABLED:-true}
      FIELD_WS_URL: ${FIELD_WS_URL:-ws://field-web-service:5002/ws/container}
      CONTAINER_TOKEN: ${C1_CONTAINER_TOKEN:?C1_CONTAINER_TOKEN zorunlu (>=32 karakter)}
      CONTAINER_ID: container-1
      TUNNEL_API_UPSTREAM: http://c1-web-service:5001
      # Konteyner→field telemetri push aralığı (UI tazeliği; varsayılan 15 sn).
      TUNNEL_TELEMETRY_INTERVAL_MS: ${TUNNEL_TELEMETRY_INTERVAL_MS:-2000}
    volumes:
      - ./container/device-configs:/app/config-docker:ro
      - ./container/maneuvers:/app/maneuver-config:ro
    depends_on:
      redis-c1:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:5001/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *log

  # ===========================================================================
  # CONTAINER-2 tier
  # ===========================================================================
  c2-device-service:
    build:
      context: ../../../
      dockerfile: services/device-service/deployment/Dockerfile
    container_name: aws-demo-c2-device-service
    environment:
      NODE_ENV: production
      REDIS_HOST: redis-c2
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      CONTAINER_ID: container-2
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: container2
      PCS_BMS_TARGET_HOST: ${PCS_BMS_TARGET_HOST:-field-device-service}
      PCS_BMS_TARGET_PORT: ${PCS_BMS_TARGET_PORT:-15502}
    volumes:
      - ./container2/device-configs:/app/config-docker:ro
    depends_on:
      redis-c2:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 384m
    logging: *log

  c2-data-service:
    build:
      context: ../../../
      dockerfile: services/data-service/deployment/Dockerfile
    container_name: aws-demo-c2-data-service
    environment:
      NODE_ENV: production
      REDIS_HOST: redis-c2
      REDIS_PORT: 6379
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: password
      TIMESCALE_DATABASE: container2
      TIMESCALE_RETENTION_AFTER: "24 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
    depends_on:
      redis-c2:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 384m
    logging: *log

  c2-management-service:
    build:
      context: ../../../
      dockerfile: services/management-service/deployment/Dockerfile
    container_name: aws-demo-c2-management-service
    environment:
      NODE_ENV: production
      SERVICE_TIER: container
      REDIS_HOST: redis-c2
      REDIS_PORT: 6379
      DEVICE_CONFIG_DIR: /app/config-docker
      MANAGEMENT_RULES_PATH: /app/config/rules.json
      MANAGEMENT_EVALUATION_INTERVAL_MS: ${MANAGEMENT_EVALUATION_INTERVAL_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./container2/rules:/app/config:ro
      - ./container2/device-configs:/app/config-docker:ro
    depends_on:
      redis-c2:
        condition: service_healthy
      c2-device-service:
        condition: service_started
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 256m
    logging: *log

  c2-web-service:
    build:
      context: ../../../
      dockerfile: services/web-service/deployment/Dockerfile
    container_name: aws-demo-c2-web-service
    environment:
      NODE_ENV: production
      PORT: 5001
      HOST: 0.0.0.0
      JWT_SECRET: ${C2_JWT_SECRET:?C2_JWT_SECRET zorunlu (>=32 karakter — openssl rand -hex 32)}
      SEED_ADMIN_PASSWORD: ${C2_SEED_ADMIN_PASSWORD:?C2_SEED_ADMIN_PASSWORD zorunlu (>=8 karakter)}
      SEED_BOSS_PASSWORD: ${C2_SEED_BOSS_PASSWORD:?C2_SEED_BOSS_PASSWORD zorunlu (>=8 karakter)}
      SEED_GUEST_PASSWORD: ${C2_SEED_GUEST_PASSWORD:?C2_SEED_GUEST_PASSWORD zorunlu (>=8 karakter)}
      REDIS_HOST: redis-c2
      REDIS_PORT: 6379
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: container2
      DEVICE_CONFIG_DIR: /app/config-docker
      MANEUVER_CONFIG_DIR: /app/maneuver-config
      TIMESCALE_CHUNK_INTERVAL: "6 hours"
      TIMESCALE_COMPRESS_AFTER: "6 hours"
      TIMESCALE_RETENTION_AFTER: "24 hours"
      FIELD_CONNECT_ENABLED: ${FIELD_CONNECT_ENABLED:-true}
      FIELD_WS_URL: ${FIELD_WS_URL:-ws://field-web-service:5002/ws/container}
      CONTAINER_TOKEN: ${C2_CONTAINER_TOKEN:?C2_CONTAINER_TOKEN zorunlu (>=32 karakter)}
      CONTAINER_ID: container-2
      TUNNEL_API_UPSTREAM: http://c2-web-service:5001
      TUNNEL_TELEMETRY_INTERVAL_MS: ${TUNNEL_TELEMETRY_INTERVAL_MS:-2000}
    volumes:
      - ./container2/device-configs:/app/config-docker:ro
      - ./container2/maneuvers:/app/maneuver-config:ro
    depends_on:
      redis-c2:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - edge-network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:5001/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *log

volumes:
  aws-demo-timescale-data:
  aws-demo-redis-field-data:
  aws-demo-integration-state-data:

networks:
  edge-network:
    name: v2-aws-demo-network
    driver: bridge
