name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Dev stack sırları — CI'a özel sabit değerler (gerçek secret DEĞİL;
      # container/field dev compose'ları env konvansiyonu gereği zorunlu alan).
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef
      SEED_ADMIN_PASSWORD: admin12345
      SEED_BOSS_PASSWORD: boss12345
      SEED_GUEST_PASSWORD: guest12345
      FIELD_ID: 11111111-2222-3333-4444-555555555555
      CONTAINER_ID: container-1
      FIELD_JWT_SECRET: ci-e2e-field-jwt-secret-0123456789abcdef
      HUB_PEER_TOKEN: ci-e2e-hub-peer-token-0123456789
      HUB_CONSUMER_TOKEN: ci-e2e-hub-consumer-token-0123456789
      FIELD_INTERNAL_API_TOKEN: ci-e2e-internal-token-0123456789
      HUB_PEER_ENABLED: "true"
      HUB_PEER_URL: ws://hub-servis:5003/ws/peer
      E2E_ADMIN_PASSWORD: admin12345
      E2E_CHANGE_PASSWORD: ci-e2e-yeni-sifre-456
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build required projects
        run: bun nx run-many --target=build --projects=container-web,field,web-service

      - name: Start container stacks
        run: |
          cp deployment/v2/dev/container/.env.example deployment/v2/dev/container/.env
          cp deployment/v2/dev/container2/.env.example deployment/v2/dev/container2/.env
          cp deployment/v2/dev/field/.env.example deployment/v2/dev/field/.env
          # CI sırları (gerçek secret DEĞİL — dev compose zorunlu alanları).
          sed -i "s|^FIELD_ID=.*|FIELD_ID=$FIELD_ID|" deployment/v2/dev/field/.env
          sed -i "s|^FIELD_JWT_SECRET=.*|FIELD_JWT_SECRET=$FIELD_JWT_SECRET|" deployment/v2/dev/field/.env
          sed -i "s|^SEED_ADMIN_PASSWORD=.*|SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD|" deployment/v2/dev/field/.env
          sed -i "s|^SEED_BOSS_PASSWORD=.*|SEED_BOSS_PASSWORD=$SEED_BOSS_PASSWORD|" deployment/v2/dev/field/.env
          sed -i "s|^SEED_GUEST_PASSWORD=.*|SEED_GUEST_PASSWORD=$SEED_GUEST_PASSWORD|" deployment/v2/dev/field/.env
          sed -i "s|^HUB_PEER_TOKEN=.*|HUB_PEER_TOKEN=$HUB_PEER_TOKEN|" deployment/v2/dev/field/.env deployment/v2/dev/container/.env deployment/v2/dev/container2/.env
          sed -i "s|^HUB_CONSUMER_TOKEN=.*|HUB_CONSUMER_TOKEN=$HUB_CONSUMER_TOKEN|" deployment/v2/dev/field/.env
          docker compose --env-file deployment/v2/dev/container/.env -f deployment/v2/dev/container/docker-compose.yml up -d --wait
          docker compose --env-file deployment/v2/dev/container2/.env -f deployment/v2/dev/container2/docker-compose.yml up -d --wait
          sleep 5

      - name: Start field stacks
        run: |
          docker compose --env-file deployment/v2/dev/field/.env -f deployment/v2/dev/field/docker-compose.yml up -d --build --wait
          sleep 5

      - name: Setup cross-tier links (register container + change passwords)
        run: |
          set -e
          # field admin: ilk giriş + şifre değişimi (seed → E2E_CHANGE_PASSWORD)
          FIELD_TOKEN=$(curl -sf -X POST http://localhost:5002/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$SEED_ADMIN_PASSWORD\"}" | bun -e 'const d=JSON.parse(await Bun.stdin.text()); process.stdout.write(d.accessToken)')
          curl -sf -X POST http://localhost:5002/api/auth/change-password \
            -H "authorization: Bearer $FIELD_TOKEN" -H 'content-type: application/json' \
            -d "{\"oldPassword\":\"$SEED_ADMIN_PASSWORD\",\"newPassword\":\"$E2E_CHANGE_PASSWORD\"}" > /dev/null
          # konteyner admin: ilk giriş + şifre değişimi
          CONT_TOKEN=$(curl -sf -X POST http://localhost:5001/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$SEED_ADMIN_PASSWORD\"}" | bun -e 'const d=JSON.parse(await Bun.stdin.text()); process.stdout.write(d.accessToken)')
          curl -sf -X POST http://localhost:5001/api/auth/change-password \
            -H "authorization: Bearer $CONT_TOKEN" -H 'content-type: application/json' \
            -d "{\"oldPassword\":\"$SEED_ADMIN_PASSWORD\",\"newPassword\":\"$E2E_CHANGE_PASSWORD\"}" > /dev/null
          echo "cross-tier links ready"

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      # v2 demo-field UI (8088) hedefli spesifikasyonlar. Eski container-web (5173)
      # varyantları v2'de UI deployment'ı olmadığı için koşulmaz (takip: e2e parity).
      - name: Run E2E tests
        run: bunx playwright test --project=chromium e2e/demo-*.spec.ts e2e/field-*.spec.ts
        env:
          FIELD_UI_URL: http://localhost:8088
          FIELD_API_URL: http://localhost:5002
          FIELD_ID: ${{ env.FIELD_ID }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_CHANGE_PASSWORD }}

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@89ef406dd8d7e03cfd12d9e0a4a378f454709029 # v4.3.6
        with:
          name: playwright-screenshots
          path: test-results/

      - name: Stop services
        if: always()
        run: |
          docker compose --env-file deployment/v2/dev/field/.env -f deployment/v2/dev/field/docker-compose.yml down -v || true
          docker compose --env-file deployment/v2/dev/container2/.env -f deployment/v2/dev/container2/docker-compose.yml down -v || true
          docker compose --env-file deployment/v2/dev/container/.env -f deployment/v2/dev/container/docker-compose.yml down -v || true
