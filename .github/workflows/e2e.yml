name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Dev stack sırları — CI'a özel sabit değerler (gerçek secret DEĞİL;
      # container/field dev compose'ları env konvansiyonu gereği zorunlu alan).
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef
      SEED_ADMIN_PASSWORD: admin12345
      SEED_BOSS_PASSWORD: boss12345
      SEED_GUEST_PASSWORD: guest12345
      FIELD_ID: 11111111-2222-3333-4444-555555555555
      CONTAINER_TOKEN: ci-e2e-container-token-0123456789
      CONTAINER_ID: container-1
      FIELD_CONNECT_ENABLED: "true"
      FIELD_WS_URL: ws://host.docker.internal:5002/ws/container
      FIELD_INTERNAL_API_TOKEN: ci-e2e-internal-token-0123456789
      E2E_ADMIN_PASSWORD: admin12345
      E2E_CHANGE_PASSWORD: ci-e2e-yeni-sifre-456
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build required projects
        run: bun nx run-many --target=build --projects=container-web,field,web-service

      - name: Start container stack
        run: |
          docker compose -f deployment/docker-compose.container.dev.yml up -d --wait
          sleep 5

      - name: Start field stack
        run: |
          docker compose -f deployment/docker-compose.field.dev.yml up -d --wait
          sleep 5

      - name: Setup cross-tier links (register container + change passwords)
        run: |
          set -e
          # field admin: ilk giriş + şifre değişimi (seed → E2E_CHANGE_PASSWORD)
          FIELD_TOKEN=$(curl -sf -X POST http://localhost:5002/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$SEED_ADMIN_PASSWORD\"}" | bun -e 'const d=JSON.parse(await Bun.stdin.text()); process.stdout.write(d.accessToken)')
          curl -sf -X POST http://localhost:5002/api/auth/change-password \
            -H "authorization: Bearer $FIELD_TOKEN" -H 'content-type: application/json' \
            -d "{\"oldPassword\":\"$SEED_ADMIN_PASSWORD\",\"newPassword\":\"$E2E_CHANGE_PASSWORD\"}" > /dev/null
          # konteyner kaydı (field DB — token hash)
          curl -sf -X POST "http://localhost:5002/api/fields/$FIELD_ID/containers/$CONTAINER_ID/register" \
            -H "authorization: Bearer $FIELD_TOKEN" -H 'content-type: application/json' \
            -d "{\"token\":\"$CONTAINER_TOKEN\"}" > /dev/null
          # konteyner admin: ilk giriş + şifre değişimi
          CONT_TOKEN=$(curl -sf -X POST http://localhost:5001/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$SEED_ADMIN_PASSWORD\"}" | bun -e 'const d=JSON.parse(await Bun.stdin.text()); process.stdout.write(d.accessToken)')
          curl -sf -X POST http://localhost:5001/api/auth/change-password \
            -H "authorization: Bearer $CONT_TOKEN" -H 'content-type: application/json' \
            -d "{\"oldPassword\":\"$SEED_ADMIN_PASSWORD\",\"newPassword\":\"$E2E_CHANGE_PASSWORD\"}" > /dev/null
          echo "cross-tier links ready"

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:5173
          FIELD_UI_URL: http://localhost:5174
          FIELD_ID: ${{ env.FIELD_ID }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_CHANGE_PASSWORD }}

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@89ef406dd8d7e03cfd12d9e0a4a378f454709029 # v4.3.6
        with:
          name: playwright-screenshots
          path: test-results/

      - name: Stop services
        if: always()
        run: |
          docker compose -f deployment/docker-compose.field.dev.yml down -v
          docker compose -f deployment/docker-compose.container.dev.yml down -v
