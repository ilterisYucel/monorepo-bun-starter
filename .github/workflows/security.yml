name: Security (SBOM + CVE)

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1" # haftalık Pazartesi 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-scan:
    name: SBOM + Trivy (0 Critical/High)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: v0.58.0

      # Kapı: dosya sistemi (bağımlılıklar + secret) + pinli imajlar.
      # 0 Critical/High CVE — nis-2.md Adım 13; ASVS V14 (güncel bağımlılıklar).
      - name: Scan (SBOM + CVE)
        run: bun tools/sbom-scan.mjs --exit-code

      - name: Gate check
        run: |
          if [ $? -ne 0 ]; then exit 1; fi
