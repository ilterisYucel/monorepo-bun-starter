name: Unit & Component Tests

# PR-level unit/component test CI (2026-08-30 T6.21 — önceden YOKTU).
# Vitest workspace: packages/* + services/* + apps/* (field/superadmin dahil).
# NIS-2 güvenlik testleri ayrı adımda `test-nis2` hedefiyle koşar (nis-2.md
# Adım 11 — CI logunda ayrı kanıt bölümü).

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Vitest Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build shared libraries
        run: bun nx run-many --target=build --projects=shared-types,shared-utils,core,ui,plugin-sdk,simulators

      - name: Run unit & component tests
        run: bun run test:unit

      - name: Upload JUnit reports (on failure)
        if: failure()
        uses: actions/upload-artifact@89ef406dd8d7e03cfd12d9e0a4a378f454709029 # v4.3.6
        with:
          name: vitest-results
          path: "**/test-results/"

  nis2-security:
    name: NIS-2 Security Tests (@nis2-security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build core
        run: bun nx run core:build

      - name: Run security-tagged tests (core)
        run: bun nx run core:test-nis2

      - name: Run security-tagged tests (web-service)
        run: bun nx run web-service:test-nis2
